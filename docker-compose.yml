# Base PostgreSQL de développement et de test.  Démarrer : docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vending
      POSTGRES_PASSWORD: vending
      POSTGRES_DB: vending_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vending -d vending_dev']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
